# ─────────────────────────────────────────────────────────────────
#  Nginx за Cloudflare Tunnel.
#
#  TLS терминируется у Cloudflare, до нас трафик доходит уже
#  расшифрованным по внутренней сети Docker. Поэтому здесь нет ни
#  443 порта, ни сертификатов, ни редиректа на https: он устроил бы
#  бесконечную петлю, так как Cloudflare и так отдаёт клиенту https.
#
#  Наружу этот порт не публикуется — только cloudflared имеет к нему
#  доступ внутри docker-сети.
# ─────────────────────────────────────────────────────────────────

# Лимиты частоты. Настоящий адрес клиента приходит от Cloudflare в
# заголовке CF-Connecting-IP; по $binary_remote_addr считать нельзя —
# там будет один и тот же адрес cloudflared, и один активный киоск
# заблокировал бы всех остальных.
map $http_cf_connecting_ip $client_ip {
    default   $http_cf_connecting_ip;
    ""        $remote_addr;          # запрос пришёл не через Cloudflare
}

limit_req_zone $client_ip zone=pin_zone:10m rate=30r/m;
limit_req_zone $client_ip zone=api_zone:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    # Видеореклама грузится через админку. Cloudflare Free режет тело
    # запроса на 100 МБ, поэтому больше ставить бессмысленно — обрыв
    # произойдёт раньше, чем запрос дойдёт сюда.
    client_max_body_size 95M;

    # ── Админка (собранная статика) ──
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA: любой путь отдаёт index.html, маршрутизация внутри React.
        try_files $uri $uri/ /index.html;
    }

    # ── Файлы для печати ──
    # Киоск качает документ по адресу /files/<uuid>.pdf, который отдаёт
    # Nginx прямо из тома с загрузками: в проде контроллер отдачи файлов
    # не поднимается (он помечен @Profile("local")). Без этого правила
    # запрос уходил в статику админки, и киоск скачивал HTML вместо
    # документа — экран превью открывался пустым.
    #
    # Имя файла — случайный UUID, подобрать его нельзя, а живёт он
    # 10 минут, после чего удаляется вместе с записью в базе.
    location ^~ /files/ {
        alias /var/lib/kiosk/uploads/;
        add_header Content-Disposition "inline";
        # Каталог наружу не показываем, только прямые обращения к файлу.
        autoindex off;
    }

    # ── Скачивание файла с телефона по одноразовому токену ──
    location ^~ /api/files/d/ {
        limit_req zone=pin_zone burst=5 nodelay;
        proxy_pass http://server:8080;
        include /etc/nginx/proxy_params_kiosk;
    }

    # ── Поток подтверждения оплаты (SSE) ──
    # Отдельной секцией: буферизация копит события и киоск узнаёт об
    # оплате только при закрытии соединения. Лимит частоты здесь тоже
    # не нужен — соединение одно на сессию и живёт минутами.
    location ~ ^/api/payments/\d+/stream$ {
        proxy_pass http://server:8080;
        include /etc/nginx/proxy_params_kiosk;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ── Остальное API ──
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://server:8080;
        include /etc/nginx/proxy_params_kiosk;
    }

    # Служебные эндпоинты наружу не отдаём.
    location /actuator/ {
        deny all;
    }
}
