# ─────────────────────────────────────────────────────────────────
#  Nginx: TLS, раздача админки, проксирование /api на Spring.
#  Замените kioskprint.kg на свой домен (в трёх местах).
# ─────────────────────────────────────────────────────────────────

# Лимит на подбор PIN. Скачивание файла идёт по четырёхзначному коду,
# то есть перебирается за 10 000 запросов. Пока в приложении нет своей
# защиты, ограничение стоит здесь: 10 запросов в минуту с адреса
# растягивают перебор на две недели вместо пары минут.
limit_req_zone $binary_remote_addr zone=pin_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;

server {
    listen 80;
    server_name kioskprint.kg;

    # Проверка домена для Let's Encrypt должна ходить по HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name kioskprint.kg;

    ssl_certificate     /etc/letsencrypt/live/kioskprint.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kioskprint.kg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Видеореклама грузится через админку — 100 МБ должно пройти.
    client_max_body_size 105M;

    # ── Админка (собранная статика) ──
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA: любой путь отдаёт index.html, маршрутизация внутри React.
        try_files $uri $uri/ /index.html;
    }

    # ── Скачивание по PIN: самый уязвимый маршрут ──
    location ~ ^/api/files/\d+/download {
        limit_req zone=pin_zone burst=5 nodelay;
        proxy_pass http://server:8080;
        include /etc/nginx/proxy_params_kiosk;
    }

    # ── Остальное API ──
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://server:8080;
        include /etc/nginx/proxy_params_kiosk;

        # SSE-поток оплаты: буферизация ломает доставку событий,
        # киоск не увидит подтверждения, пока не закроется соединение.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Health наружу не отдаём — он раскрывает состояние БД и внутренностей.
    location /actuator/ {
        deny all;
    }
}
