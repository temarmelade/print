# /etc/nginx/conf.d/kiosk.conf

upstream kiosk_server {
    server kiosk-server:8080;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name kioskprint.kg;

    ssl_certificate     /etc/letsencrypt/live/kioskprint.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kioskprint.kg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---------- REST API ----------
    location /api/ {
        proxy_pass http://kiosk_server;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 50M;            # лимит upload'а
        proxy_request_buffering off;         # стрим в backend, не на диск nginx'а
        proxy_read_timeout 60s;
    }

    # ---------- Static files from Docker volume ----------
    location /files/ {
        alias /var/kiosk/uploads/;           # этот путь смонтирован как Docker volume

        autoindex off;
        limit_except GET HEAD { deny all; }

        # Никогда не исполнять загруженный контент
        location ~* \.(php|sh|py|cgi|jsp|asp|aspx)$ {
            deny all;
        }

        # Атрибуция как attachment + защита от MIME-sniffing
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff"  always;
        add_header Cache-Control "private, max-age=300" always;

        # Опционально: ограничить скорость отдачи (защита от bandwidth-abuse)
        # limit_rate 5m;
    }

    location / { return 404; }
}