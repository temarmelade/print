spring:
  application:
    name: kiosk-server

  datasource:
    url: ${KIOSK_DB_URL:jdbc:postgresql://localhost:5432/kiosk}
    username: ${KIOSK_DB_USER:kiosk}
    password: ${KIOSK_DB_PASSWORD:kiosk}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false                    # КРИТИЧНО, см. ниже
    hibernate:
      ddl-auto: validate                   # Flyway управляет схемой, JPA только проверяет
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 105MB
      file-size-threshold: 1MB

server:
  port: ${KIOSK_SERVER_PORT:8080}
  address: ${KIOSK_SERVER_ADDRESS:0.0.0.0}
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.printkiosk.server: DEBUG
    org.hibernate.SQL: DEBUG               # покажет реальный SQL во время разработки

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# ───── Наши настройки ─────
kiosk:
  pin:
    ttl: PT10M
    max-attempts: 5
    lockout: PT60S
  file:
    max-size-bytes: 20971520
    allowed-mime:
      - application/pdf
      - image/jpeg
      - image/png
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
  storage:
    path: ${KIOSK_STORAGE_PATH:/tmp/kiosk-uploads}
    public-base-url: ${KIOSK_PUBLIC_BASE_URL:http://localhost:8080}
    cleanup-interval: PT1M
    cleanup-grace: PT30S
  printer:
    name: "Canon LBP6030/6040/6018L"      # переопредели в application-local.yml на свой
    snmp-host: ""                          # пусто = USB-принтер, SNMP пропускается
    snmp-port: 161
    snmp-community: public
    snmp-poll-interval-ms: 30000
finik:
  enabled: ${FINIK_ENABLED:false}
  environment: ${FINIK_ENV:beta}
  base-url: ${FINIK_BASE_URL:https://openapi-beta.finik.kg}
  api-key: ${FINIK_API_KEY:}
  private-key-path: ${FINIK_PRIVATE_KEY_PATH:}
  account-id: ${FINIK_ACCOUNT_ID:}
  redirect-url: ${FINIK_REDIRECT_URL:https://example.com/return}
  webhook-url: ${FINIK_WEBHOOK_URL:https://kioskprint.kg/api/payments/webhook/finik}
  merchant-category-code: "0742"
  qr-name: "PrintKiosk"

telegram:
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:false}     # локально false, на проде true
    token:   ${TELEGRAM_BOT_TOKEN:}
    username: ${TELEGRAM_BOT_USERNAME:PrintKioskBot}