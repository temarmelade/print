version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kiosk-postgres-dev
    environment:
      POSTGRES_DB: kiosk
      POSTGRES_USER: kiosk
      POSTGRES_PASSWORD: kiosk
    ports:
      - "5432:5432"
    volumes:
      - kiosk-pg-data:/var/lib/postgresql/data

volumes:
  kiosk-pg-data: